<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne - LUVIKA</title>
  <style>
    body { background: #020617; color: #fff; font-family: system-ui; text-align: center; padding: 20vh 20px; }
    .logo { width: 120px; margin: 0 auto 30px; }
    h1 { font-size: 2.5rem; margin: 20px 0; background: linear-gradient(90deg, #0ea5e9, #06b6d4); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { font-size: 1.2rem; color: #94a3b8; margin: 15px 0; }
    .pulse { display: inline-block; width: 12px; height: 12px; background: #ef4444; border-radius: 50%; margin-right: 10px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .btn { display: inline-block; margin-top: 30px; padding: 12px 30px; background: linear-gradient(90deg, #0ea5e9, #06b6d4); color: white; text-decoration: none; border-radius: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="pulse"></div>
  <h1>HORS LIGNE</h1>
  <p>Impossible de se connecter à Internet</p>
  <p>Vous pouvez continuer à utiliser les fonctionnalités hors ligne de LUVIKA</p>
  <a href="/" class="btn">🔄 Recharger quand en ligne</a>
</body>
</html>
